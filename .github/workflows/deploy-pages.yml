name: Deploy Pixel Art Gallery to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          # Historial completo: build_gallery.py ordena las participaciones por fecha de llegada
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generar índice de la galería
        run: |
          python3 scripts/build_gallery.py

      - name: Preparar sitio estático
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          cp -r PixelArt _site/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  # El despliegue va en otro job: GitHub tarda a veces en listar el artefacto recién subido
  # (https://github.com/actions/deploy-pages/issues/451) y, si falla, «Re-run failed jobs»
  # repite solo este job sin subir un segundo artefacto "github-pages" (eso también da error).
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.intento1.outputs.page_url || steps.intento2.outputs.page_url || steps.intento3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en GitHub Pages
        id: intento1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Esperar a que GitHub liste el artefacto
        if: steps.intento1.outcome == 'failure'
        run: sleep 30

      - name: Desplegar en GitHub Pages (2.º intento)
        id: intento2
        if: steps.intento1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Esperar un poco más
        if: steps.intento1.outcome == 'failure' && steps.intento2.outcome == 'failure'
        run: sleep 90

      - name: Desplegar en GitHub Pages (último intento)
        id: intento3
        if: steps.intento1.outcome == 'failure' && steps.intento2.outcome == 'failure'
        uses: actions/deploy-pages@v5
